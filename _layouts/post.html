
---
layout: default
---
<article class="prose-container">
  <header class="text-center space-y-4 mb-8">
    <h1 class="text-4xl md:text-5xl font-bold neon-text">{{ page.title }}</h1>
    
    <div class="flex items-center justify-center gap-4 text-sm text-muted">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%d %b %Y" }}
      </time>
      {% if page.category %}
        <span>{{ page.category }}</span>
      {% endif %}
    </div>

    {% if page.tags %}
    <div class="flex justify-center gap-2">
      {% for tag in page.tags %}
        <span class="text-xs px-2 py-1 rounded-full bg-secondary text-muted">{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}
  </header>

  <div class="prose prose-invert max-w-none">
    {{ content }}
  </div>
</article>
